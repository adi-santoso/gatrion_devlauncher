name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  windows:
    name: Windows (lint, test, build, e2e)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: CLI regression tests
        run: npm test

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Renderer build
        run: npx vite build

      - name: E2E smoke (Electron + Playwright)
        run: npm run test:e2e
