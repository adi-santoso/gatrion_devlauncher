name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: ${{ matrix.os }} (lint, test, build, e2e)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests (vitest)
        run: npm test

      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Build main + preload + renderer (electron-vite)
        run: npx electron-vite build

      - name: E2E smoke (Electron + Playwright)
        run: npm run test:e2e
        if: runner.os != 'Linux'
      # Electron needs a virtual display on headless Linux runners.
      - name: E2E smoke (Electron + Playwright, xvfb)
        run: xvfb-run -a npm run test:e2e
        if: runner.os == 'Linux'
