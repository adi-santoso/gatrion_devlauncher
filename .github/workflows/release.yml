name: Release

# Build the Windows installer/portable on a version tag (v*), run the full
# quality gate, and publish artifacts + the electron-updater feed (latest.yml)
# to GitHub Releases. The tag version must match package.json, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: CLI tests
        run: npm test

      - name: Unit tests + coverage gate
        run: npx vitest run --coverage

      - name: Audit
        run: npm audit --audit-level=high

      - name: Build renderer
        run: npx vite build

      - name: Build & publish
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
