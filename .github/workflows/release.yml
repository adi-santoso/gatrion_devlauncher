name: Release

# Build the Windows installer/portable on a version tag (v*), run the full
# quality gate, and publish artifacts + the electron-updater feed (latest.yml)
# to GitHub Releases. The tag version must match package.json, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.9.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: CLI tests
        run: npm test

      - name: Unit tests + coverage gate
        run: npx vitest run --coverage

      - name: Audit
        run: npm audit --audit-level=high

      - name: Build main + preload + renderer (electron-vite)
        run: npx electron-vite build

      - name: Ensure exactly one published release exists
        shell: bash
        # Pre-create the release so electron-builder always uploads assets into a
        # single, published release. Without this, each artifact creates its own
        # publisher and they can race to create multiple releases for the same tag
        # (which splits the assets across them and breaks auto-update).
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "DevLauncher $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
